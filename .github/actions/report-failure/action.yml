name: report-failure
description: Open an issue for a failed scheduled check, or comment on the open one with the same title
inputs:
  title:
    description: Exact issue title; one open issue per title collects every failure
    required: true
  summary:
    description: One or two sentences on what failed and where to start
    required: true
  token:
    description: Token with issues write permission
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        TITLE: ${{ inputs.title }}
        SUMMARY: ${{ inputs.summary }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        body="$(printf '%s\n\nRun: %s (%s, attempt %s)\n' "$SUMMARY" "$RUN_URL" "$GITHUB_EVENT_NAME" "$GITHUB_RUN_ATTEMPT")"
        number="$(gh issue list --state open --limit 100 --search "in:title $TITLE" --json number,title \
          | jq -r --arg title "$TITLE" '[.[] | select(.title == $title)][0].number // empty')"
        if [ -n "$number" ]; then
          gh issue comment "$number" --body "$body"
          echo "Commented on #$number"
        else
          gh issue create --title "$TITLE" --body "$body"
        fi
