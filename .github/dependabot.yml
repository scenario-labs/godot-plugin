version: 2
updates:
  - package-ecosystem: "github-actions"
    # The root and the local composite action under .github/actions/.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: "weekly"
    # Wait a week after an action release before proposing it.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
  # Node tooling for CI and contributors (commitlint), not the plugin.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      node:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
