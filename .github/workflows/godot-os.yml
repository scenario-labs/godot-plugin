name: godot-os

# Informational, never a required check: the tests and the zip install check on
# Linux, macOS and Windows with the pinned Godot, and on Linux with the newest
# Godot build (stable, beta or dev) to see engine changes coming. Pull requests
# run it only when they change this workflow or the Godot setup.
# GitHub can disable schedules after 60 days of repository inactivity.

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/godot-os.yml"
      - ".github/actions/setup-godot/**"

permissions:
  contents: read

# Serialize scheduled and manual runs so the failure issue cannot be created twice.
concurrency:
  group: godot-os-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: godot ${{ matrix.godot }} (${{ matrix.os }})
    if: github.repository == 'scenario-labs/godot-plugin'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        godot: [4.7.2-stable]
        include:
          - os: ubuntu-24.04
            godot: newest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 3.12 rather than the newest: before 3.15, Windows Python defaults to the
      # ANSI code page, the case the toolkit's UTF-8 handling exists for.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Choose the Godot release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ matrix.godot }}
        run: |
          if [ "$WANTED" = newest ]; then
            WANTED="$(gh api 'repos/godotengine/godot-builds/releases?per_page=1' --jq '.[0].tag_name')"
          fi
          echo "Godot $WANTED"
          echo "version=$WANTED" >> "$GITHUB_OUTPUT"
      # No pinned SHA-512 here: each archive is checked against its release's SHA512-SUMS.txt.
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ steps.release.outputs.version }}
      - name: Toolkit, tests and the zip install check
        shell: bash
        run: |
          set -euo pipefail
          python tools/toolkit.py fetch
          python tools/toolkit.py check
          python tools/run_tests.py all
          python tools/build_zip.py --verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: godot-logs-${{ matrix.os }}-${{ steps.release.outputs.version }}
          path: .agent_out/logs/
          if-no-files-found: ignore
          retention-days: 14

  report:
    needs: test
    if: ${{ always() && !cancelled() && github.event_name != 'pull_request' && needs.test.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/report-failure
        with:
          title: "Scheduled Godot OS and version check fails"
          summary: >-
            The tests or the zip install check failed on at least one OS or Godot build.
            The run lists each leg; failed legs keep their Godot logs as artifacts.
          token: ${{ github.token }}
